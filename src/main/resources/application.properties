spring.application.name=bonapharm
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/bonapharm
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_bonapharm?serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Datos del emisor de las guías PDF, configurados solo en el entorno local.
bonapharm.empresa.nombre=${EMPRESA_NOMBRE:Bonapharm}
bonapharm.empresa.direccion=${EMPRESA_DIRECCION:}
bonapharm.empresa.punto-partida=${EMPRESA_PUNTO_PARTIDA:}
