<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reporte de productos próximos a vencer')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="page-hero"><div class="container"><h1><i class="bi bi-hourglass-split me-2"></i>Reporte de productos próximos a vencer</h1><p>Lotes que vencen pronto o ya vencieron</p></div></div>
<div class="container pb-5">
    <div class="bp-card">
        <ul th:replace="~{fragments :: tabs('vencimientos')}"></ul>
        <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/reportes/vencimientos}">
            <input type="hidden" name="enviado" value="1">
            <div class="col-md-3"><label class="form-label fw-semibold">Vencen en los próximos</label>
                <select class="form-select" name="dias">
                    <option value="30" th:selected="${dias == 30}">30 días</option><option value="60" th:selected="${dias == 60}">60 días</option><option value="90" th:selected="${dias == 90}">90 días</option></select></div>
            <div class="col-md-3"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="incluir" id="inc" th:checked="${incluir}"><label class="form-check-label" for="inc">Incluir ya vencidos</label></div></div>
            <div class="col-auto d-flex gap-2">
                <button class="btn btn-bp"><i class="bi bi-funnel me-1"></i>Generar</button>
                <button class="btn btn-outline-danger" formtarget="_blank" th:formaction="@{/reportes/vencimientos/pdf}"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
                <button class="btn btn-outline-success" th:formaction="@{/reportes/vencimientos/excel}"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
            </div>
        </form>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div th:if="${r != null}" th:replace="~{fragments :: resultado(${r})}"></div>
    </div>
</div>
</body>
</html>
