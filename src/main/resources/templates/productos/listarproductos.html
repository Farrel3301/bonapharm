<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="page-hero"><div class="container"><h1><i class="bi bi-capsule me-2"></i>Productos</h1><p>Catálogo de productos farmacéuticos</p></div></div>
<div class="container pb-5">
    <div class="bp-card">
        <div class="alert alert-success py-2" th:if="${ok}" th:text="${ok}"></div>
        <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
        <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
            <form class="d-flex gap-2" th:action="@{/productos/listar}" method="get">
                <input class="form-control" name="q" th:value="${q}" placeholder="Buscar por nombre o SKU">
                <button class="btn btn-outline-bp"><i class="bi bi-search"></i></button>
            </form>
            <a class="btn btn-bp" th:href="@{/productos/registro}"><i class="bi bi-plus-circle me-1"></i>Registrar producto</a>
        </div>
        <div class="text-center text-secondary py-5" th:if="${#lists.isEmpty(lista)}">
            <i class="bi bi-search fs-1"></i><p class="mt-2 mb-0">No se encontraron resultados.</p>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(lista)}">
            <table class="table table-hover align-middle">
                <thead><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Lote</th><th>Guía de remisión</th><th>Precio</th><th>Stock</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="p : ${lista}">
                    <td class="fw-semibold" th:text="${p.sku}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria}"></td>
                    <td th:text="${p.numeroLote}"></td>
                    <td th:text="${p.numeroGuiaRemision}"></td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio,1,2)}"></td>
                    <td><span class="pill" th:classappend="${p.stock == 0} ? 'pill-out' : (${p.stock <= p.stockMinimo} ? 'pill-low' : 'pill-ok')" th:text="${p.stock}"></span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-bp" th:href="@{/productos/actualiza/{id}(id=${p.id})}"><i class="bi bi-pencil"></i></a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/productos/deshabilitar/{id}(id=${p.id})}" onclick="return confirm('¿Deshabilitar este producto?')"><i class="bi bi-slash-circle"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
