<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Stock')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="page-hero"><div class="container"><h1><i class="bi bi-clipboard-data me-2"></i>Consultar stock</h1><p>Cantidad disponible por producto</p></div></div>
<div class="container pb-5">
    <div class="bp-card">
        <form class="d-flex gap-2 mb-3" th:action="@{/productos/stock}" method="get">
            <input class="form-control" name="q" th:value="${q}" placeholder="Nombre o SKU del producto" autofocus>
            <button class="btn btn-bp"><i class="bi bi-search me-1"></i>Consultar</button>
        </form>
        <div class="alert alert-warning" th:if="${noRegistrado}"><i class="bi bi-info-circle me-1"></i>El producto no se encuentra registrado en el sistema.</div>
        <div class="table-responsive" th:unless="${noRegistrado}">
            <table class="table table-hover align-middle">
                <thead><tr><th>SKU</th><th>Producto</th><th>Lote</th><th>Disponible</th><th>Mínimo</th><th>Estado</th></tr></thead>
                <tbody>
                <tr th:each="p : ${lista}">
                    <td class="fw-semibold" th:text="${p.sku}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.numeroLote}"></td>
                    <td class="fw-bold fs-5" th:text="${p.stock}"></td>
                    <td th:text="${p.stockMinimo}"></td>
                    <td><span class="pill" th:classappend="${p.stock == 0} ? 'pill-out' : (${p.stock <= p.stockMinimo} ? 'pill-low' : 'pill-ok')"
                              th:text="${p.stock == 0} ? 'Agotado' : (${p.stock <= p.stockMinimo} ? 'Stock bajo' : 'Disponible')"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
