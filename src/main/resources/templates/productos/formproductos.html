<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Producto')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="page-hero"><div class="container">
    <h1><i class="bi bi-capsule me-2"></i><span th:text="${producto.id == null} ? 'Registrar producto' : 'Modificar producto'"></span></h1>
    <p>Completa los datos del producto farmacéutico</p>
</div></div>
<div class="container pb-5" style="max-width:820px">
    <form class="bp-card" method="post" th:object="${producto}"
          th:action="${producto.id == null} ? @{/productos/registrar} : @{/productos/actualizar/{id}(id=${producto.id})}">
        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span></div>
        <div class="row g-3">
			
			<div class="col-md-4">
			    <label class="form-label fw-semibold">
			        SKU <span class="badge text-bg-success ms-1">Automático</span>
			    </label>
			    <input class="form-control bg-body-secondary" th:if="${producto.id != null}" th:field="*{sku}" readonly>
				
			    <input class="form-control" th:if="${producto.id == null}" value="Se genera al guardar" disabled>
			</div>
			
            <div class="col-md-8"><label class="form-label fw-semibold">Nombre *</label><input class="form-control" th:field="*{nombre}" maxlength="120"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Categoría *</label>
                <input class="form-control" th:field="*{categoria}" list="cats" placeholder="Ej: Analgésicos">
                <datalist id="cats"><option>Analgésicos</option><option>Antibióticos</option><option>Antialérgicos</option><option>Vitaminas</option><option>Cuidado personal</option></datalist></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Precio (S/) *</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{precio}"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">N.º de guía de remisión *</label><input class="form-control" th:field="*{numeroGuiaRemision}" maxlength="30" placeholder="Ej: T001-00001234"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">N.º de lote *</label><input class="form-control" th:field="*{numeroLote}" maxlength="40" placeholder="Ej: L2401"></div>
			<div class="col-md-6"><label class="form-label fw-semibold" th:text="${producto.id == null} ? 'Stock inicial *' : 'Stock actual'">Stock inicial *</label>
			<input class="form-control" th:classappend="${producto.id !=null} ?'bg-body-secondary'" type="number" min="0" th:field="*{stock}" th:readonly="${producto.id != null}">
			<small class="text-secondary" th:if="${producto.id != null}">El stock cambia con entradas, salidas y ventas.</small></div>
			
			<div class="col-md-6">
			    <label class="form-label fw-semibold">
			        Stock mínimo <span class="badge text-bg-success ms-1">Calculado</span>
			    </label>
				
			    <input class="form-control bg-body-secondary" th:if="${producto.id != null}" th:field="*{stockMinimo}" readonly>
			    <input class="form-control" th:if="${producto.id == null}" value="Se calcula al guardar" disabled>
				
			    <small class="text-secondary">
			        (consumo diario × días de entrega) + stock de seguridad.
			        Mientras no haya ventas, usa el promedio de la categoría.
			    </small>
			</div>
			
            <div class="col-12"><label class="form-label fw-semibold">Descripción</label><textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea></div>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/productos/listar}">Cancelar</a>
            <button class="btn btn-bp"><i class="bi bi-check2-circle me-1"></i>Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
