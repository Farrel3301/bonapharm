<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Producto')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="page-hero"><div class="container">
    <h1><i class="bi bi-capsule me-2"></i><span th:text="${producto.id == null} ? 'Registrar producto' : 'Modificar producto'"></span></h1>
    <p>Completa los datos del producto farmacéutico</p>
</div></div>
<div class="container pb-5" style="max-width:820px">
    <form class="bp-card" method="post" th:object="${producto}"
          th:action="${producto.id == null} ? @{/productos/registrar} : @{/productos/actualizar/{id}(id=${producto.id})}">
        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span></div>
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label fw-semibold">Código de producto *</label><select class="form-select" th:field="*{codigo}"><option value="">Seleccione Código...</option><option th:each="m : ${medicamentos}" th:value="${m.codigo}" th:text="${m.codigo}" th:attr="data-nombre=${m.nombre}"></option></select></div>
            <div class="col-md-8"><label class="form-label fw-semibold">Nombre *</label><select class="form-select" th:field="*{nombre}"><option value="">Seleccione medicamento...</option><option th:each="m : ${medicamentos}" th:value="${m.nombre}" th:text="${m.nombre}" th:attr="data-codigo=${m.codigo}"></option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Categoría *</label>
                <select class="form-select" th:field="*{categoria}"><option value="">Seleccione categoría...</option><option th:each="c : ${categorias}" th:value="${c.nombre}" th:text="${c.nombre}"></option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Precio (S/) *</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{precio}"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Stock actual</label>
                <input class="form-control" type="number" min="0" th:field="*{stock}" readonly><small class="text-secondary">Se actualiza con las entradas y las ventas.</small></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Stock mínimo *</label><input class="form-control" type="number" min="0" th:field="*{stockMinimo}"></div>
            <div class="col-12"><label class="form-label fw-semibold">Descripción</label><textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea></div>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/productos/listar}">Cancelar</a>
            <button class="btn btn-bp"><i class="bi bi-check2-circle me-1"></i>Guardar</button>
        </div>
    </form>
</div>
<script>
// Código y nombre son un par: al elegir uno se selecciona el otro
const s=document.getElementById('codigo'),n=document.getElementById('nombre');
s.addEventListener('change',()=>{n.value=s.selectedOptions[0].dataset.nombre||'';});
n.addEventListener('change',()=>{s.value=n.selectedOptions[0].dataset.codigo||'';});
</script>
</body>
</html>
